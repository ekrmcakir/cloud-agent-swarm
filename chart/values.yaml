replicaCount: 1

image:
  repository: ghcr.io/ekrmcakir/cloud-agent-swarm
  pullPolicy: IfNotPresent
  tag: "1.0.0"

serviceAccount:
  create: true
  name: cloud-agent-swarm-sa

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

env:
  SWARM_MOCK_MODE: "false"
  AWS_DEFAULT_REGION: "eu-west-1"
  K8S_NAMESPACE: "production"
